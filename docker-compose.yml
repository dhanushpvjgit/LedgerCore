services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgercore
      POSTGRES_USER: ledgercore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgercore_dev}
    ports:
      - "5432:5432"
    volumes:
      - ledgercore-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgercore -d ledgercore"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ledgercore
      DB_USER: ledgercore
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ledgercore_dev}
    ports:
      - "8080:8080"

volumes:
  ledgercore-data:
