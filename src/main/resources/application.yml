spring:
  application:
    name: ledgercore
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgercore}
    username: ${DB_USER:ledgercore}
    password: ${DB_PASSWORD:ledgercore_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    dev.dhanush.ledgercore: INFO
